name: P5 Maintenance Bundle

on:
  pull_request:
  push:
    branches:
      - agent/adaptive-performance

concurrency:
  group: p5-maintenance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare generated maintenance files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply deterministic source changes
        run: node scripts/prepare-p5-maintenance.mjs

      - name: Regenerate Bun lockfile
        run: bun install

      - name: Commit generated files
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package.json bun.lock src/components/solar-system/ephemeris.ts src/components/solar-system/store.ts; then
            echo "Generated maintenance files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock src/components/solar-system/ephemeris.ts src/components/solar-system/store.ts
          git commit -m "apply generated p5 maintenance"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Package generated files
        run: |
          tar -czf p5-maintenance.tar.gz \
            package.json \
            bun.lock \
            src/components/solar-system/ephemeris.ts \
            src/components/solar-system/store.ts

      - name: Upload maintenance bundle
        uses: actions/upload-artifact@v4
        with:
          name: p5-maintenance
          path: p5-maintenance.tar.gz
          if-no-files-found: error
          retention-days: 1
