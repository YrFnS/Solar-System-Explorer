name: Remove Stale Lint Suppression

on:
  push:
    branches:
      - agent/adaptive-performance

concurrency:
  group: remove-stale-lint-suppression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/adaptive-performance

      - name: Remove obsolete suppression
        run: |
          sed -i '/eslint-disable-next-line react-hooks\/exhaustive-deps/d' \
            src/components/solar-system/ExperienceDock.tsx

      - name: Commit when changed
        run: |
          if git diff --quiet -- src/components/solar-system/ExperienceDock.tsx; then
            echo "No stale suppression remains."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/solar-system/ExperienceDock.tsx
          git commit -m "remove stale lint suppression"
          git push origin HEAD:agent/adaptive-performance
