name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate orbital engine
        run: bun run ephemeris:validate

      - name: Build optimized application
        run: bun run build

      - name: Smoke test modular interface
        run: bun run ui:smoke
