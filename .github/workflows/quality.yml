name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
      - 'integration/**'

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release gate contract
        run: bun run quality:gate

      - name: Report direct frame callbacks
        run: bun run frame-callbacks:report

      - name: Audit modules and dependencies
        run: bun run audit

      - name: Validate lint rules
        run: bun run lint

      - name: Validate TypeScript
        run: bun run typecheck

      - name: Validate orbital engine
        run: bun run ephemeris:validate

      - name: Validate benchmark decision engine
        run: bun run webgpu:analysis:validate

      - name: Generate optimized WebP fallbacks
        run: bun run textures:optimize

      - name: Prepare Basis transcoder runtime
        run: bun run textures:basis:sync

      - name: Verify committed KTX2 textures
        run: bun run textures:ktx2:verify

      - name: Build optimized application
        run: bun run build:next

      - name: Enforce production artifact budgets
        run: bun run performance:budget

      - name: Smoke test desktop, mobile, accessibility, WebGL, and KTX2
        run: bun run ui:smoke

      - name: Smoke test physical-device capture, launch, and review workspaces
        run: bun run device-acceptance:smoke

      - name: Smoke test runtime quality transitions and recovery
        run: bun run runtime:smoke

      - name: Smoke test WebGPU laboratory backend selection
        run: bun run webgpu:smoke

      - name: Smoke test real-device benchmark protocol
        run: bun run webgpu:benchmark:smoke

      - name: Smoke test benchmark evidence workspace
        run: bun run webgpu:results:smoke
