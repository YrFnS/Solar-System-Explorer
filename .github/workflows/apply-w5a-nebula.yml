name: Apply W5a Nebula Integration

on:
  push:
    branches:
      - agent/webgpu-lab
    paths:
      - '.github/workflows/apply-w5a-nebula.yml'

permissions:
  contents: write

concurrency:
  group: apply-w5a-nebula
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out WebGPU laboratory branch
        uses: actions/checkout@v4
        with:
          ref: agent/webgpu-lab
          fetch-depth: 0

      - name: Apply W5a scene, diagnostics, status, and browser gate
        run: python scripts/apply-w5a-nebula.py

      - name: Publish W5a integration and remove one-shot helpers
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "W5a integration is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "complete W5a TSL nebula parity"
          git fetch origin agent/webgpu-lab
          git rebase origin/agent/webgpu-lab
          git push origin HEAD:agent/webgpu-lab
