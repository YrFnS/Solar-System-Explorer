name: Refresh Bun Lockfile

on:
  push:
    branches:
      - agent/adaptive-performance

concurrency:
  group: refresh-lockfile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/adaptive-performance

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate lockfile
        run: bun install

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "refresh bun lockfile"
          git push origin HEAD:agent/adaptive-performance
